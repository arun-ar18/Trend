name: Trend CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Test Docker Hub API authentication
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Testing Docker Hub authentication API..."

          curl -sS -o /tmp/docker-auth-response.json \
            -w "HTTP status: %{http_code}\n" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"identifier\":\"$DOCKERHUB_USERNAME\",\"secret\":\"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/auth/token

          echo "Response received from Docker Hub."
