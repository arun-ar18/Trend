name: Trend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker Hub secret format
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Token length: ${#DOCKERHUB_TOKEN}"
          if [[ "$DOCKERHUB_TOKEN" == dckr_pat_* ]]; then
            echo "Token prefix: OK"
          else
            echo "Token prefix: NOT OK"
          fi
          if [[ "$DOCKERHUB_TOKEN" == *$'\n'* || "$DOCKERHUB_TOKEN" == *$'\r'* ]]; then
            echo "Token contains a newline: YES"
          else
            echo "Token contains a newline: NO"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/trend-app:latest .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/trend-app:latest

      - name: Verify Docker image
        run: docker images
